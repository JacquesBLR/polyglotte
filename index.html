<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Polyglotte</title>
    <meta name="description" content="Apprends une langue en parlant : conversation orale avec un tuteur IA, corrections, révisions et exercices." />

    <!-- PWA : installable sur l'écran d'accueil (iOS et Android). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#c2410c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Polyglotte" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Réinitialisation recommandée par react-native-web (gabarit Expo par défaut). -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #faf7f2;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Encoche et barre d'état (#63). En mode autonome sur iOS, la page occupe tout
         l'écran (status-bar-style black-translucent + viewport-fit=cover) : sans ces
         marges, l'en-tête passe sous l'heure et ses boutons cessent de répondre, iOS
         réservant les appuis de cette bande au système.
         Les marges sont portées par le CSS et non par une valeur JS : `env()` n'est
         connu que du navigateur, et sa valeur change à la rotation de l'appareil.
         `!important` est nécessaire : react-native-web injecte ses règles dans le
         <head> après celle-ci, à spécificité égale. -->
    <style id="polyglotte-safe-area">
      [data-entete] {
        padding-top: calc(14px + env(safe-area-inset-top)) !important;
      }
      /* Deux règles : chacune reprend la marge basse déjà portée par le composant,
         qui diffère, et y ajoute l'encombrement de l'indicateur d'accueil. */
      [data-pied="saisie"] {
        padding-bottom: calc(10px + env(safe-area-inset-bottom)) !important;
      }
      [data-pied="feuille"] {
        padding-bottom: calc(18px + env(safe-area-inset-bottom)) !important;
      }
    </style>
  <link rel="icon" href="/polyglotte/favicon.ico"/></head>

  <body>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <div id="root"></div>
  <script src="/polyglotte/_expo/static/js/web/index-ce1e72cd7cb3109cc712410241c4a724.js" defer></script>
</body>
</html>
