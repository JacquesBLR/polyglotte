name: Publier sur GitHub Pages

# Synchronise le contenu statique de l'application vers la branche gh-pages,
# que GitHub Pages publie automatiquement sur https://jacquesblr.github.io/polyglotte/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Construire la v2 (Expo web)
        working-directory: app
        run: |
          npm ci
          CI=1 npx expo export --platform web
      - name: Préparer le site statique
        run: |
          # v2 (app universelle) à la racine du site
          mkdir -p _site
          cp -r app/dist/* _site/
          cp README.md _site/
          # v1 (webapp gelée) archivée sous /v1/
          mkdir -p _site/v1
          cp -r css js icons _site/v1/
          cp index.html manifest.webmanifest sw.js _site/v1/
          # Ancien emplacement /v2/ : redirection vers la racine + SW d'auto-destruction
          mkdir -p _site/v2
          cp redirects/v2/index.html redirects/v2/sw.js _site/v2/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Publication automatique de Parla!"
