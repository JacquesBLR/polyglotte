name: Publier sur GitHub Pages

# Synchronise le contenu statique de l'application vers la branche gh-pages,
# que GitHub Pages publie automatiquement sur https://jacquesblr.github.io/hello-world/

on:
  push:
    branches: [claude/catalan-learning-tool-qqc9nz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site statique
        run: |
          mkdir -p _site
          cp -r index.html css js icons manifest.webmanifest sw.js README.md _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "Publication automatique de Parla!"
